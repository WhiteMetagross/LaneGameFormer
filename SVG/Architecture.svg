<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1149" height="541" viewBox="0 0 1149 541" role="img" aria-labelledby="title desc">
  <title id="title">LaneGameFormer architecture</title>
  <desc id="desc">Editable vector reconstruction of the LaneGameFormer hybrid neural architecture diagram.</desc>

  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#f6f6f2"/>
      <path d="M20 0H0V20" fill="none" stroke="#e6e6df" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#222222"/>
    </marker>
    <style><![CDATA[
      .cond { font-family: "Open Sans Condensed", "Arial Narrow", Arial, sans-serif; }
      .title { font: 800 31px "Open Sans Condensed", "Arial Narrow", Arial, sans-serif; fill:#111; stroke:#111; stroke-width:.28px; paint-order:stroke fill; }
      .meta { font: 400 14px "Open Sans Condensed", "Arial Narrow", Arial, sans-serif; fill:#555; }
      .section { font: 700 18px "Open Sans Condensed", "Arial Narrow", Arial, sans-serif; letter-spacing:.35px; }
      .sectionBig { font: 700 22px "Open Sans Condensed", "Arial Narrow", Arial, sans-serif; letter-spacing:.7px; }
      .body { font: 400 16px "Arial Narrow", "Open Sans Condensed", Arial, sans-serif; }
      .bodyBold { font: 700 17px "Arial Narrow", "Open Sans Condensed", Arial, sans-serif; }
      .module { font: italic 700 23px "Open Sans Condensed", "Arial Narrow", Arial, sans-serif; }
      .fusionMain { font: 700 23px "Open Sans Condensed", "Arial Narrow", Arial, sans-serif; }
      .fusionSub { font: 400 17px "Open Sans Condensed", "Arial Narrow", Arial, sans-serif; }
      .level { font: italic 700 22px "Open Sans Condensed", "Arial Narrow", Arial, sans-serif; fill:#093b0c; }
      .tiny { font: 400 11px "Open Sans Condensed", "Arial Narrow", Arial, sans-serif; }
      .lossTitle { font: 700 14px "Open Sans Condensed", "Arial Narrow", Arial, sans-serif; }
      .lossSub { font: 400 11px "Open Sans Condensed", "Arial Narrow", Arial, sans-serif; }
      .legend { font: 400 14px "Open Sans Condensed", "Arial Narrow", Arial, sans-serif; fill:#333; }
      .flow { fill:none; stroke:#222; stroke-width:2; stroke-linejoin:miter; stroke-linecap:square; }
      .thinFlow { fill:none; stroke:#222; stroke-width:1.7; stroke-linejoin:miter; stroke-linecap:square; }
    ]]></style>
  </defs>

  <!-- Background -->
  <rect id="background" width="1149" height="541" fill="url(#grid)"/>

  <!-- Title and dimension captions -->
  <g id="heading" text-anchor="middle">
    <text class="title" x="574.5" y="36" textLength="802" lengthAdjust="spacingAndGlyphs">LaneGameFormer: Hybrid Neural Architecture for Multi-Agent Trajectory Prediction</text>
    <text class="meta" x="71" y="67" textLength="58" lengthAdjust="spacingAndGlyphs">Batch (B)</text>
    <text class="meta" x="241" y="64" textLength="57" lengthAdjust="spacingAndGlyphs">Agents (N)</text>
    <text class="meta" x="374" y="65" textLength="78" lengthAdjust="spacingAndGlyphs">Map Nodes (M)</text>
    <text class="meta" x="495" y="65" textLength="78" lengthAdjust="spacingAndGlyphs">Timesteps (T)</text>
    <text class="meta" x="611" y="67" textLength="92" lengthAdjust="spacingAndGlyphs">Hidden Dim (D)</text>
    <text class="meta" x="766" y="67" textLength="58" lengthAdjust="spacingAndGlyphs">Modes (K)</text>
  </g>

  <!-- INPUTS -->
  <g id="inputs">
    <rect id="inputs-container" x="8" y="74" width="124" height="400" rx="10" fill="#e5d0f2" stroke="#8e44ad" stroke-width="2.4"/>
    <text class="section" x="70" y="97" fill="#5b1080" text-anchor="middle">INPUTS</text>

    <g id="agent-history">
      <rect x="19.5" y="103.5" width="101" height="83.5" rx="5.5" fill="#c9a0e0" stroke="#8e44ad" stroke-width="1.8"/>
      <text class="bodyBold" x="70" y="124" fill="#2a0848" text-anchor="middle">Agent</text>
      <text class="bodyBold" x="70" y="145" fill="#2a0848" text-anchor="middle">History</text>
      <text class="body" x="70" y="167" fill="#4a1468" text-anchor="middle">(B, N, T, 3)</text>
    </g>

    <g id="lane-graph">
      <rect x="19.5" y="223.5" width="101" height="84" rx="5.5" fill="#c9a0e0" stroke="#8e44ad" stroke-width="1.8"/>
      <text class="bodyBold" x="70" y="251" fill="#2a0848" text-anchor="middle">Lane Graph</text>
      <text class="body" x="70" y="281" fill="#4a1468" text-anchor="middle">(B, M, N<tspan baseline-shift="sub" font-size="11">node</tspan>, 2)</text>
    </g>

    <g id="traffic-flow">
      <rect x="19.5" y="343.5" width="101" height="84" rx="5.5" fill="#c9a0e0" stroke="#8e44ad" stroke-width="1.8"/>
      <text class="bodyBold" x="70" y="369" fill="#2a0848" text-anchor="middle">Traffic</text>
      <text class="bodyBold" x="70" y="389" fill="#2a0848" text-anchor="middle">Flow</text>
      <text class="body" x="70" y="412" fill="#4a1468" text-anchor="middle">(B, N, T, 2)</text>
    </g>
  </g>

  <!-- LaneGCN encoder -->
  <g id="lanegcn-encoder">
    <rect id="encoder-container" x="174" y="71" width="133" height="400" rx="9" fill="#fde9ba" stroke="#d8880a" stroke-width="2.3"/>
    <text class="section" x="240" y="108" fill="#7a4200" text-anchor="middle" textLength="113" lengthAdjust="spacingAndGlyphs">LANEGCN ENCODER</text>

    <g id="actornet">
      <rect x="184.5" y="124.5" width="112" height="100" rx="6" fill="#f7c96a" stroke="#d8880a" stroke-width="1.6"/>
      <text class="module" x="240.5" y="168" fill="#3a1a00" text-anchor="middle">ActorNet</text>
      <text class="body" x="240.5" y="203" fill="#5a3100" text-anchor="middle">(B, N, D)</text>
    </g>

    <g id="mapnet">
      <rect x="184.5" y="289.5" width="112" height="101" rx="6" fill="#f7c96a" stroke="#d8880a" stroke-width="1.6"/>
      <text class="module" x="240.5" y="331" fill="#3a1a00" text-anchor="middle">MapNet</text>
      <text class="body" x="240.5" y="365" fill="#5a3100" text-anchor="middle">(B, M, D)</text>
    </g>
  </g>

  <!-- Cross-modal fusion -->
  <g id="cross-modal-fusion">
    <rect id="fusion-container" x="354" y="72" width="150" height="400" rx="10" fill="#d2eaf8" stroke="#2e86c1" stroke-width="2.4"/>
    <text class="section" x="429" y="94" fill="#0e3d6e" text-anchor="middle" textLength="125" lengthAdjust="spacingAndGlyphs">Cross-Modal Fusion</text>

    <g id="fusion-a2m">
      <rect x="369" y="100" width="120" height="74" rx="5.5" fill="#5aaade" stroke="#1a6aaa" stroke-width="1.9"/>
      <text class="fusionMain" x="429" y="131" fill="#fff" text-anchor="middle">A2M</text>
      <text class="fusionSub" x="429" y="158" fill="#dff3ff" text-anchor="middle">(Agent-Map)</text>
    </g>

    <g id="fusion-m2m">
      <rect x="369" y="196" width="120" height="73" rx="5.5" fill="#5aaade" stroke="#1a6aaa" stroke-width="1.9"/>
      <text class="fusionMain" x="429" y="228" fill="#fff" text-anchor="middle">M2M</text>
      <text class="fusionSub" x="429" y="254" fill="#dff3ff" text-anchor="middle">(Map-Map)</text>
    </g>

    <g id="fusion-m2a">
      <rect x="369" y="292" width="120" height="73" rx="5.5" fill="#5aaade" stroke="#1a6aaa" stroke-width="1.9"/>
      <text class="fusionMain" x="429" y="324" fill="#fff" text-anchor="middle">M2A</text>
      <text class="fusionSub" x="429" y="350" fill="#dff3ff" text-anchor="middle">(Map-Agent)</text>
    </g>

    <g id="fusion-a2a">
      <rect x="369" y="388" width="120" height="73" rx="5.5" fill="#5aaade" stroke="#1a6aaa" stroke-width="1.9"/>
      <text class="fusionMain" x="429" y="420" fill="#fff" text-anchor="middle">A2A</text>
      <text class="fusionSub" x="429" y="447" fill="#dff3ff" text-anchor="middle">(Agent-Agent)</text>
    </g>
  </g>

  <!-- GameFormer decoder -->
  <g id="gameformer-decoder">
    <rect id="decoder-container" x="533" y="74" width="306" height="400" rx="10" fill="#cce8c0" stroke="#2e8b2e" stroke-width="2.4"/>
    <text class="section" x="686" y="97" fill="#286729" text-anchor="middle" textLength="202" lengthAdjust="spacingAndGlyphs">GAMEFORMER DECODER</text>

    <g id="decoder-level-0">
      <rect x="548" y="105.5" width="210" height="112" rx="6" fill="#76b876" stroke="#2a7a2a" stroke-width="1.6"/>
      <text class="level" x="653.5" y="141" text-anchor="middle" fill="#08280a">Level-0</text>
      <text class="body" x="653.5" y="161" fill="#174f19" text-anchor="middle">Physics-Prior</text>
      <rect x="569" y="166" width="178" height="22" rx="4" fill="#e2f4e2" stroke="#64a864" stroke-width="1"/>
      <text class="tiny" x="658" y="181" fill="#244f28" text-anchor="middle">Agent “i” attends to others only</text>
    </g>

    <g id="decoder-level-1">
      <rect x="545.5" y="241" width="211" height="49.5" rx="6" fill="#76b876" stroke="#2a7a2a" stroke-width="1.6"/>
      <text class="level" x="651" y="272" text-anchor="middle" fill="#08280a">Level-1</text>
    </g>

    <g id="decoder-level-2">
      <rect x="545.5" y="317" width="210" height="50" rx="6" fill="#76b876" stroke="#2a7a2a" stroke-width="1.6"/>
      <text class="level" x="651" y="349" text-anchor="middle" fill="#08280a">Level-2</text>
    </g>

    <g id="decoder-level-3">
      <rect x="545.5" y="393.5" width="211" height="51.5" rx="6" fill="#76b876" stroke="#2a7a2a" stroke-width="1.6"/>
      <text class="level" x="651" y="427" text-anchor="middle" fill="#08280a">Level-3</text>
    </g>

    <g id="dimension-cards" class="cond" text-anchor="middle" fill="#285a2b">
      <g id="dimension-0"><rect x="765" y="145" width="65" height="34" rx="5" fill="#f4fcf4" stroke="#69ad69" stroke-width="1.2"/><text class="body" x="797.5" y="168">(D, D)</text></g>
      <g id="dimension-1"><rect x="763" y="245" width="67" height="43" rx="5" fill="#f4fcf4" stroke="#69ad69" stroke-width="1.2"/><text class="body" x="796.5" y="272" font-size="13">(B, N, K, ·, 2)</text></g>
      <g id="dimension-2"><rect x="763" y="316" width="67" height="44" rx="5" fill="#f4fcf4" stroke="#69ad69" stroke-width="1.2"/><text class="body" x="796.5" y="344" font-size="13">(B, N, K, 1)</text></g>
      <g id="dimension-3"><rect x="762" y="400" width="67" height="40" rx="5" fill="#f4fcf4" stroke="#69ad69" stroke-width="1.2"/><text class="body" x="795.5" y="426" font-size="13">(B, N, K, *)</text></g>
    </g>
  </g>

  <!-- OUTPUTS -->
  <g id="outputs">
    <rect id="outputs-container" x="882" y="74" width="138" height="400" rx="10" fill="#f8d0d6" stroke="#c03050" stroke-width="2.4"/>
    <text class="sectionBig" x="951.5" y="108" fill="#6e0c24" text-anchor="middle">OUTPUTS</text>

    <g id="gmm-trajectories">
      <rect x="895.5" y="134.5" width="113.5" height="110" rx="6" fill="#f0a0b0" stroke="#b03050" stroke-width="1.8"/>
      <text class="bodyBold" x="952" y="163" fill="#450510" text-anchor="middle">GMM</text>
      <text class="bodyBold" x="952" y="191" fill="#450510" text-anchor="middle">Trajectories</text>
      <text class="body" x="952" y="221" fill="#68182d" text-anchor="middle">(B, N, K, T, 2)</text>
    </g>

    <g id="mode-probabilities">
      <rect x="894.5" y="295.5" width="113.5" height="110" rx="6" fill="#f0a0b0" stroke="#b03050" stroke-width="1.8"/>
      <text class="bodyBold" x="952" y="325" fill="#450510" text-anchor="middle">Mode</text>
      <text class="bodyBold" x="952" y="353" fill="#450510" text-anchor="middle">Probabilities</text>
      <text class="body" x="952" y="385" fill="#68182d" text-anchor="middle">(B, N, K, 1)</text>
    </g>
  </g>

  <!-- LOSS -->
  <g id="losses">
    <rect id="loss-container" x="1076.5" y="74.5" width="59" height="397" rx="10" fill="#fbf1b0" stroke="#c8a818" stroke-width="2.4"/>
    <text class="section" x="1106" y="96" fill="#574700" text-anchor="middle" textLength="42" lengthAdjust="spacingAndGlyphs">LOSS</text>

    <g id="loss-conf">
      <rect x="1087.5" y="101.5" width="39.5" height="72" rx="5" fill="#f8e45a" stroke="#c8a818" stroke-width="1.6"/>
      <text class="lossTitle" x="1107.75" y="133" fill="#2a1800" text-anchor="middle">Conf</text>
      <text class="lossSub" x="1107.75" y="159" fill="#2a1800" text-anchor="middle">L<tspan baseline-shift="sub" font-size="8">conf</tspan></text>
    </g>
    <g id="loss-ref">
      <rect x="1087.5" y="197.5" width="39.5" height="66" rx="5" fill="#f8e45a" stroke="#c8a818" stroke-width="1.6"/>
      <text class="lossTitle" x="1107.75" y="228" fill="#2a1800" text-anchor="middle">Ref</text>
      <text class="lossSub" x="1107.75" y="253" fill="#2a1800" text-anchor="middle">L<tspan baseline-shift="sub" font-size="8">ref</tspan></text>
    </g>
    <g id="loss-safety">
      <rect x="1087.5" y="286.5" width="39.5" height="72" rx="5" fill="#f8e45a" stroke="#c8a818" stroke-width="1.6"/>
      <text class="lossTitle" x="1107.75" y="318" fill="#2a1800" text-anchor="middle" textLength="35" lengthAdjust="spacingAndGlyphs">Safety</text>
      <text class="lossSub" x="1107.75" y="347" fill="#2a1800" text-anchor="middle">L<tspan baseline-shift="sub" font-size="8">safety</tspan></text>
    </g>
    <g id="loss-skip">
      <rect x="1087.5" y="381.5" width="39.5" height="66" rx="5" fill="#f8e45a" stroke="#c8a818" stroke-width="1.6"/>
      <text class="lossTitle" x="1107.75" y="412" fill="#2a1800" text-anchor="middle">Skip</text>
      <text class="lossSub" x="1107.75" y="436" fill="#2a1800" text-anchor="middle">L<tspan baseline-shift="sub" font-size="8">skip</tspan></text>
    </g>
  </g>

  <!-- Independent editable data-flow connectors -->
  <g id="connectors">
    <!-- inputs to encoder -->
    <path id="arrow-agent-to-actor" class="flow" d="M121 147H151V159H173" marker-end="url(#arrow)"/>
    <path id="arrow-lane-to-map" class="flow" d="M121 266H151V336H173" marker-end="url(#arrow)"/>
    <path id="arrow-traffic-to-map" class="flow" d="M121 386H151V336H173" marker-end="url(#arrow)"/>

    <!-- encoder to fusion -->
    <path id="actor-trunk" class="thinFlow" d="M296 192H326V124"/>
    <path id="arrow-actor-a2m" class="flow" d="M326 124H354" marker-end="url(#arrow)"/>
    <path id="arrow-actor-m2a" class="flow" d="M326 192V339H354" marker-end="url(#arrow)"/>
    <path id="arrow-actor-a2a" class="flow" d="M326 192V430H354" marker-end="url(#arrow)"/>
    <text class="tiny cond" x="295" y="188" fill="#444">(B, N, D)</text>

    <path id="map-trunk" class="thinFlow" d="M296 339H334V233"/>
    <path id="arrow-map-m2m" class="flow" d="M334 233H354" marker-end="url(#arrow)"/>
    <path id="arrow-map-m2a" class="flow" d="M334 339H354" marker-end="url(#arrow)"/>
    <text class="tiny cond" x="294" y="335" fill="#444">(B, M, D)</text>

    <!-- fusion to decoder -->
    <path id="fusion-merge-a2m" class="thinFlow" d="M490 138H505V270"/>
    <path id="fusion-merge-m2m" class="thinFlow" d="M490 233H505"/>
    <path id="fusion-merge-m2a" class="thinFlow" d="M490 329H505V270"/>
    <path id="fusion-merge-a2a" class="thinFlow" d="M490 426H505V270"/>
    <path id="arrow-fusion-decoder" class="flow" d="M505 270H532" marker-end="url(#arrow)"/>

    <!-- decoder level flow -->
    <path id="arrow-level0-level1" class="flow" d="M654 218V240" marker-end="url(#arrow)"/>
    <path id="arrow-level1-level2" class="flow" d="M655 292V316" marker-end="url(#arrow)"/>
    <path id="arrow-level2-level3" class="flow" d="M655 368V393" marker-end="url(#arrow)"/>

    <!-- decoder to outputs -->
    <path id="decoder-output-trunk" class="thinFlow" d="M829 419H848V180"/>
    <path id="arrow-decoder-gmm" class="flow" d="M848 180H882" marker-end="url(#arrow)"/>
    <path id="arrow-decoder-modes" class="flow" d="M848 350H882" marker-end="url(#arrow)"/>

    <!-- outputs to losses -->
    <path id="output-loss-trunk" class="thinFlow" d="M1021 286H1044V138"/>
    <path id="output-loss-trunk-lower" class="thinFlow" d="M1021 350H1044V414"/>
    <path id="arrow-loss-conf" class="flow" d="M1044 138H1075" marker-end="url(#arrow)"/>
    <path id="arrow-loss-ref" class="flow" d="M1044 233H1075" marker-end="url(#arrow)"/>
    <path id="arrow-loss-safety" class="flow" d="M1044 325H1075" marker-end="url(#arrow)"/>
    <path id="arrow-loss-skip" class="flow" d="M1044 414H1075" marker-end="url(#arrow)"/>
  </g>

  <!-- Legend -->
  <g id="legend" transform="translate(22 496)">
    <g id="legend-input"><rect x="0" y="3" width="31" height="20" rx="4" fill="#c9a0e0" stroke="#8e44ad" stroke-width="1.7"/><text class="legend" x="34" y="18" textLength="66" lengthAdjust="spacingAndGlyphs">Input Layer</text></g>
    <g id="legend-encoder"><rect x="154" y="0" width="31" height="23" rx="4" fill="#f7c96a" stroke="#d8880a" stroke-width="1.7"/><text class="legend" x="186" y="18" textLength="111" lengthAdjust="spacingAndGlyphs">LaneGCN Encoder</text></g>
    <g id="legend-fusion"><rect x="334" y="0" width="35" height="20" rx="4" fill="#5aaade" stroke="#2e86c1" stroke-width="1.7"/><text class="legend" x="371" y="18" textLength="115" lengthAdjust="spacingAndGlyphs">Cross-Modal Fusion</text></g>
    <g id="legend-decoder"><rect x="581" y="0" width="33" height="18" rx="4" fill="#76b876" stroke="#2e8b2e" stroke-width="1.7"/><text class="legend" x="617" y="17" textLength="129" lengthAdjust="spacingAndGlyphs">GameFormer Decoder</text></g>
    <g id="legend-output"><rect x="873" y="0" width="35" height="18" rx="4" fill="#f0a0b0" stroke="#c03050" stroke-width="1.7"/><text class="legend" x="911" y="17" textLength="67" lengthAdjust="spacingAndGlyphs">Output Layer</text></g>
    <g id="legend-loss"><rect x="1004" y="0" width="35" height="18" rx="4" fill="#f8e45a" stroke="#c8a818" stroke-width="1.7"/><text class="legend" x="1044" y="17" textLength="72" lengthAdjust="spacingAndGlyphs">Loss Functions</text></g>
  </g>
</svg>
